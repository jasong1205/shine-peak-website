# Jekyll Configuration
title: "Shine Peak - Eco-Friendly Disposable Tableware"
description: "Leading manufacturer of eco-friendly disposable tableware: bagasse, kraft paper, wooden bamboo, paper straws."
url: "https://shine-peak.netlify.app"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Plugins (enable basic plugins for SEO)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  products:
    output: true
    permalink: /products/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"

# SEO
author: "Shine Peak"
email: "info@shinepeak.com"
twitter_username: "shinepeak"
facebook_username: "shinepeak"
instagram_username: "shinepeak"

# Social links
social:
  twitter: "https://twitter.com/shinepeak"
  facebook: "https://facebook.com/shinepeak"
  instagram: "https://instagram.com/shinepeak"
  linkedin: "https://linkedin.com/company/shinepeak"

# Exclude from processing
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - .gitattributes
  - CNAME
  - Gemfile
  - Gemfile.lock
